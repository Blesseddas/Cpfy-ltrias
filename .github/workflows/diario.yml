name: Seguimiento diario de quinielas
on:
  schedule:
    - cron: "30 3 * * *"   # 23:30 hora de Santo Domingo (UTC-4), después del último sorteo
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy scipy
      - name: Recolectar EnLotería (si falla, queda aviso en Actions)
        run: python recolectar_enloteria.py
        continue-on-error: true
      - name: Recolectar Lotería de la 1 (segunda fuente)
        run: python recolectar_loteriadela1.py
        continue-on-error: true
        env:
          L1_CSV_URL: ${{ vars.L1_CSV_URL }}
      - run: python actualizar_loterias.py
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "capafy-bot"
          git config user.email "bot@capafy.ai"
          git add -A
          git diff --cached --quiet || git commit -m "Actualización $(date -u +%F)"
          git pull --rebase origin main
          git push
